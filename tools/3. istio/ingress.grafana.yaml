apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "grafana-ingress"
  namespace: istio-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.lab`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
  #tls: {}