apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: blue-green-app
  namespace: test

spec:
  replicas: 1
  strategy:
    blueGreen:
      #maxSurge: 1
      #maxUnavailable: 0
      activeService: blue-green-app-svc
      previewService: blue-green-app-pws-svc
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: blue-green-app
  template:
    metadata:
      labels:
        app: blue-green-app
    spec:
      containers:
      - name: blue-green-app
        image: codeparce/blue-green-app:green # Cambiar a la blue 
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi