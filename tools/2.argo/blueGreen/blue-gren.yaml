apiVersion: v1
kind: Namespace
metadata:
  name: test
---
# Name app: blue-green-app
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "blue-green-app-ingress" 
  namespace: test
  labels:
    namespace: test
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`example.lab`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: blue-green-app-svc
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: blue-green-app-svc
  namespace: test
spec:
  ports:
    - name: stable        
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: blue-green-app-pws-svc
  namespace: test
  labels:
    namespace: test
spec:
  ports:
    - name: preview         # 🔹 nombre obligatorio y único
      port: 80
      targetPort: 80
  type: ClusterIP